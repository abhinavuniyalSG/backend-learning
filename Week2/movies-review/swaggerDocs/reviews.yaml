paths:
  /movies/{movieId}/reviews:
    parameters:
      - $ref: "#/components/parameters/ReviewMovieId"

    get:
      tags: [Reviews]
      summary: Get reviews for a movie with optional filters

      parameters:
        - name: rating
          in: query
          required: false
          description: Rating value to filter by.
          schema:
            type: integer
            minimum: 1
            maximum: 5

        - name: rating_filter
          in: query
          required: false
          description: Compare rating using =, >, <, >=, or <=.
          schema:
            type: string
            enum: ["=", ">", "<", ">=", "<="]

      responses:
        "200":
          description: Reviews matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "404":
          $ref: "#/components/responses/ReviewMovieNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

    post:
      tags: [Reviews]
      summary: Create a review for a movie
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"

      responses:
        "201":
          description: Review created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/ReviewMovieNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

  /movies/{movieId}/reviews/averageRating:
    parameters:
      - $ref: "#/components/parameters/ReviewMovieId"

    get:
      tags: [Reviews]
      summary: Get the average rating for a movie

      responses:
        "200":
          description: Average rating result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: object
                    required:
                      - averageRating
                    properties:
                      averageRating:
                        type: number
                        nullable: true
                        format: float
                        example: 4.5

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "404":
          $ref: "#/components/responses/ReviewMovieNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

  /movies/{movieId}/reviews/{reviewId}:
    parameters:
      - $ref: "#/components/parameters/ReviewMovieId"

      - $ref: "#/components/parameters/ReviewId"

    get:
      tags: [Reviews]
      summary: Get a review by movie ID and review ID

      responses:
        "200":
          description: Review detail.

          content:
            application/json:
              schema:
                type: object

                required:
                  - result

                properties:
                  result:
                    $ref: "#/components/schemas/ReviewDetailsResponse"

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "404":
          $ref: "#/components/responses/ReviewNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

    patch:
      tags: [Reviews]
      summary: Update one or more fields of a review
      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewRequest"

      responses:
        "200":
          description: Review updated.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReviewResponse"

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ReviewNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

    delete:
      tags: [Reviews]
      summary: Delete a review
      security:
        - bearerAuth: []

      responses:
        "204":
          description: Review deleted successfully.

        "400":
          $ref: "#/components/responses/ReviewValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/ReviewNotFound"

        "500":
          $ref: "#/components/responses/ReviewInternalError"

components:
  parameters:
    ReviewMovieId:
      name: movieId
      in: path
      required: true
      description: Movie UUID.
      schema:
        type: string
        format: uuid

    ReviewId:
      name: reviewId
      in: path
      required: true
      description: Review UUID.
      schema:
        type: string
        format: uuid

  schemas:
    # ============================================================
    # EXISTING REVIEW SCHEMA
    # DO NOT CHANGE THIS
    # ============================================================

    Review:
      type: object

      required:
        - id
        - movie_id
        - rating
        - comment

      properties:
        id:
          type: string
          format: uuid

        movie_id:
          type: string
          format: uuid

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comment:
          type: string
          maxLength: 1000
          example: A thoughtful and exciting film.

    # ============================================================
    # REVIEW ARRAY ITEM RESPONSE
    # Used by GET /movies/{movieId}/reviews
    # ============================================================

    ReviewResponseArray:
      type: object

      required:
        - id
        - rating
        - comment
        - movie
        - user

      properties:
        id:
          type: string
          format: uuid

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

        comment:
          type: string
          maxLength: 1000
          example: Good movie.

        movie:
          $ref: "#/components/schemas/ReviewResponseMovie"

        user:
          $ref: "#/components/schemas/ReviewResponseUser"

    # ============================================================
    # MOVIE INSIDE REVIEW RESPONSE
    # ============================================================

    ReviewResponseMovie:
      type: object

      required:
        - id
        - title
        - director
        - genre
        - release_year

      properties:
        id:
          type: string
          format: uuid

        title:
          type: string
          maxLength: 100
          example: the matrix

        director:
          type: string
          maxLength: 100
          example: the wachowskis

        genre:
          $ref: "#/components/schemas/ReviewMovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 1999

    # ============================================================
    # GENRE USED BY REVIEW MOVIE RESPONSE
    # ============================================================

    ReviewMovieGenre:
      type: string
      enum:
        - Sci-Fi
        - Action
        - Crime
        - Drama
        - Thriller
        - Animation
      example: Sci-Fi

    # ============================================================
    # USER INSIDE REVIEW RESPONSE
    # ============================================================

    ReviewResponseUser:
      type: object

      required:
        - id
        - name
        - mail
        - role

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string
          example: Jane Doe

        mail:
          type: string
          format: email
          example: jane@example.com

        role:
          type: string
          enum:
            - user
            - admin
          example: user

    # ============================================================
    # SINGLE REVIEW DETAIL RESPONSE
    # Used by GET /movies/{movieId}/reviews/{reviewId}
    # ============================================================

    ReviewDetailsResponse:
      type: object

      required:
        - message
        - data

      properties:
        message:
          type: string
          example: found

        data:
          $ref: "#/components/schemas/ReviewDetailsResponseData"

    # ============================================================
    # SINGLE REVIEW DATA
    # ============================================================

    ReviewDetailsResponseData:
      type: object

      required:
        - id
        - rating
        - comment
        - movie
        - user

      properties:
        id:
          type: string
          format: uuid

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comment:
          type: string
          maxLength: 1000
          example: A thoughtful and exciting film.

        movie:
          $ref: "#/components/schemas/ReviewResponseMovie"

        user:
          $ref: "#/components/schemas/ReviewResponseUser"

    # ============================================================
    # CREATE REVIEW REQUEST
    # ============================================================

    CreateReviewRequest:
      type: object
      additionalProperties: false

      required:
        - rating
        - comment

      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comment:
          type: string
          minLength: 1
          maxLength: 1000
          example: A thoughtful and exciting film.

    # ============================================================
    # UPDATE REVIEW REQUEST
    # ============================================================

    UpdateReviewRequest:
      type: object
      additionalProperties: false
      minProperties: 1

      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comment:
          type: string
          minLength: 1
          maxLength: 1000
          example: Updated review comment.

    # ============================================================
    # CREATE REVIEW RESPONSE
    # ============================================================

    CreateReviewResponse:
      type: object

      required:
        - message
        - data

      properties:
        message:
          type: string
          example: Review created

        data:
          $ref: "#/components/schemas/Review"

    # ============================================================
    # UPDATE REVIEW RESPONSE
    # ============================================================

    UpdateReviewResponse:
      type: object

      required:
        - message
        - id
        - movie_id

      properties:
        message:
          type: string
          example: Updated review

        id:
          type: string
          format: uuid

        movie_id:
          type: string
          format: uuid

    # ============================================================
    # GET ALL REVIEWS RESPONSE
    # ============================================================

    ReviewListResponse:
      type: object

      required:
        - message
        - count
        - data

      properties:
        message:
          type: string
          enum:
            - Found
            - No Reviews

        count:
          type: integer
          minimum: 0
          example: 2

        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewResponseArray"

    # ============================================================
    # ERROR RESPONSE
    # ============================================================

    ReviewErrorResponse:
      type: object

      required:
        - message

      properties:
        message:
          type: string

    # ============================================================
    # VALIDATION ERROR RESPONSE
    # ============================================================

    ReviewValidationErrorResponse:
      type: object

      required:
        - message
        - errors

      properties:
        message:
          type: string
          example: Validation failed

        errors:
          type: array
          items:
            type: string

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewErrorResponse"

          example:
            message: Unauthorized

    Forbidden:
      description: Authenticated user is not allowed to perform this action.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewErrorResponse"

          example:
            message: "Forbidden: you are not allowed to update this review"

    ReviewValidationError:
      description: The request did not satisfy input validation.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewValidationErrorResponse"

    ReviewMovieNotFound:
      description: No movie exists for the provided movie ID.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewErrorResponse"

    ReviewNotFound:
      description: No review exists for the provided movie ID and review ID.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewErrorResponse"

    ReviewInternalError:
      description: An unexpected server error occurred.

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewErrorResponse"
