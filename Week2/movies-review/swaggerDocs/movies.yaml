paths:
  /movies:
    get:
      tags: [Movies]
      summary: List or filter movies
      description: >
        Returns every movie when no filters are supplied. Title and director
        use partial matching. Movies can also be filtered by genre and by a
        minimum computed average rating.

      parameters:
        - name: id
          in: query
          description: Filter by movie UUID.
          schema:
            type: string
            format: uuid

        - name: title
          in: query
          description: Filter by a partial title match.
          schema:
            type: string
            minLength: 1

        - name: director
          in: query
          description: Filter by a partial director-name match.
          schema:
            type: string
            minLength: 1

        - name: genre
          in: query
          description: Filter by genre.
          schema:
            $ref: "#/components/schemas/MovieGenre"

        - name: release_year
          in: query
          description: >
            Filter by release year. Uses exact matching unless year_filter
            is supplied.
          schema:
            type: integer
            minimum: 1888

        - name: year_filter
          in: query
          description: Comparison operator for release_year.
          schema:
            type: string
            enum: ["=", ">", "<", ">=", "<="]

        - name: min_average_rating
          in: query
          description: >
            Return only movies whose computed averageRating is greater than
            or equal to this value. Movies with no reviews have an
            averageRating of null and are not included when this filter is used.
          schema:
            type: number
            minimum: 0
            maximum: 5
            example: 4.5

      responses:
        "200":
          description: Movies matching the supplied filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"

        "400":
          $ref: "#/components/responses/ValidationError"

        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Movies]
      summary: Create a movie
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieRequest"

      responses:
        "201":
          description: Movie created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMovieResponse"

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "409":
          $ref: "#/components/responses/DuplicateMovie"

        "500":
          $ref: "#/components/responses/InternalError"

  /movies/{id}:
    parameters:
      - $ref: "#/components/parameters/MovieId"

    get:
      tags: [Movies]
      summary: Get a movie by ID

      responses:
        "200":
          description: Movie lookup result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetailsResponse"

        "400":
          $ref: "#/components/responses/ValidationError"

        "404":
          $ref: "#/components/responses/MovieNotFound"

        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Movies]
      summary: Update one or more movie fields
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMovieRequest"

      responses:
        "200":
          description: Movie updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMovieResponse"

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/MovieNotFound"

        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Movies]
      summary: Delete a movie
      security:
        - bearerAuth: []

      responses:
        "204":
          description: Movie deleted successfully.

        "400":
          $ref: "#/components/responses/ValidationError"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/MovieNotFound"

        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    MovieId:
      name: id
      in: path
      required: true
      description: Movie UUID.
      schema:
        type: string
        format: uuid

  schemas:
    MovieGenre:
      type: string
      enum:
        - Sci-Fi
        - Action
        - Crime
        - Drama
        - Thriller
        - Animation
      example: Sci-Fi

    # ============================================================
    # EXISTING MOVIE SCHEMA
    # DO NOT CHANGE THIS
    # ============================================================

    Movie:
      type: object

      required:
        - id
        - title
        - director
        - genre
        - release_year
        - averageRating

      properties:
        id:
          type: string
          format: uuid

        title:
          type: string
          maxLength: 100
          example: Inception

        director:
          type: string
          maxLength: 100
          example: Christopher Nolan

        genre:
          $ref: "#/components/schemas/MovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 2010

        averageRating:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          example: 4.5
          description: >
            The average rating computed by the server from the movie's reviews.
            This value cannot be set directly by the client. Returns null when
            the movie has no reviews.

    # ============================================================
    # NEW SCHEMA FOR /movies GET RESPONSE
    # ============================================================

    MovieListItem:
      type: object

      required:
        - id
        - title
        - director
        - genre
        - release_year
        - reviews
        - user
        - averageRating

      properties:
        id:
          type: string
          format: uuid

        title:
          type: string
          maxLength: 100
          example: the matrix

        director:
          type: string
          maxLength: 100
          example: the wachowskis

        genre:
          $ref: "#/components/schemas/MovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 1999

        reviews:
          type: array
          items:
            $ref: "#/components/schemas/MovieListReview"

        user:
          $ref: "#/components/schemas/MovieListUser"

        averageRating:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          example: 3
          description: >
            The average rating computed by the server from the movie's reviews.
            Returns null when the movie has no reviews.

    MovieListReview:
      type: object

      required:
        - id
        - rating
        - comment

      properties:
        id:
          type: string
          format: uuid

        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4

        comment:
          type: string
          example: Good movie.

    MovieListUser:
      type: object

      required:
        - id
        - name
        - mail
        - role

      properties:
        id:
          type: string
          format: uuid

        name:
          type: string
          example: Jane Doe

        mail:
          type: string
          format: email
          example: jane@example.com

        role:
          type: string
          enum:
            - user
            - admin
          example: user

    # ============================================================
    # MOVIE CREATE DATA
    # ============================================================

    MovieCreateData:
      type: object

      required:
        - id
        - title
        - director
        - genre
        - release_year

      properties:
        id:
          type: string
          format: uuid

        title:
          type: string
          example: Inception

        director:
          type: string
          example: Christopher Nolan

        genre:
          $ref: "#/components/schemas/MovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 2010

    # ============================================================
    # CREATE MOVIE REQUEST
    # ============================================================

    CreateMovieRequest:
      type: object
      additionalProperties: false

      required:
        - title
        - director
        - genre
        - release_year

      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Inception

        director:
          type: string
          minLength: 1
          maxLength: 100
          example: Christopher Nolan

        genre:
          $ref: "#/components/schemas/MovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 2010

    # ============================================================
    # UPDATE MOVIE REQUEST
    # ============================================================

    UpdateMovieRequest:
      type: object
      additionalProperties: false
      minProperties: 1

      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Inception

        director:
          type: string
          minLength: 1
          maxLength: 100
          example: Christopher Nolan

        genre:
          $ref: "#/components/schemas/MovieGenre"

        release_year:
          type: integer
          minimum: 1888
          example: 2010

    # ============================================================
    # CREATE MOVIE RESPONSE
    # ============================================================

    CreateMovieResponse:
      type: object

      required:
        - message
        - data

      properties:
        message:
          type: string
          example: Movie created

        data:
          $ref: "#/components/schemas/MovieCreateData"

    # ============================================================
    # UPDATE MOVIE RESPONSE
    # ============================================================

    UpdateMovieResponse:
      type: object

      required:
        - message
        - result

      properties:
        message:
          type: string
          example: update success

        result:
          type: object
          description: Raw update result returned by TypeORM

    # ============================================================
    # MOVIE LIST RESPONSE
    # ============================================================

    MovieResponse:
      type: object

      required:
        - message
        - count
        - data

      properties:
        message:
          type: string
          enum:
            - Found
            - No Movies

        count:
          type: integer
          minimum: 0
          example: 4

        data:
          type: array
          items:
            $ref: "#/components/schemas/MovieListItem"

    # ============================================================
    # MOVIE DETAILS RESPONSE
    # ============================================================

    MovieDetailsResponse:
      type: object

      required:
        - message
        - data

      properties:
        message:
          type: string
          enum:
            - Found

        data:
          type: array
          items:
            $ref: "#/components/schemas/MovieListItem"

    # ============================================================
    # ERROR RESPONSE
    # ============================================================

    ErrorResponse:
      type: object

      required:
        - message

      properties:
        message:
          type: string

    # ============================================================
    # VALIDATION ERROR RESPONSE
    # ============================================================

    ValidationErrorResponse:
      type: object

      required:
        - message
        - errors

      properties:
        message:
          type: string
          example: Validation failed

        errors:
          type: array
          items:
            type: string

  # ==============================================================
  # COMMON RESPONSES
  # ==============================================================

  responses:
    ValidationError:
      description: The request did not satisfy input validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

          example:
            message: Unauthorized

    Forbidden:
      description: Authenticated user is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

          example:
            message: "Forbidden: you are not allowed to update this movie"

    DuplicateMovie:
      description: A movie with the same title already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

          example:
            message: Movie already exist

    MovieNotFound:
      description: No movie exists for the provided ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

          example:
            message: Movie not found

    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
